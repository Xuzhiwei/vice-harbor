<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Harbor — an original harbour crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101d; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #57a75a; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Vice Harbor: explore a coastal city on foot and by car, run missions, and mind the wanted stars"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
